[project]
name = "clinicalgraph-api"
version = "2.0.0"
description = "ClinicalGraph 2.0 read-only FastAPI backend for Neo4j Graph RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "neo4j>=6.0.0",
    "openai>=1.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
