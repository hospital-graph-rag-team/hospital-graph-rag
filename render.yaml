services:
  - type: web
    name: clinicalgraph-api
    runtime: python
    plan: free
    branch: feat/clinicalgraph-v2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: "production"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BACKEND_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "180"
